# Prefix: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Low escape-time so Escape reaches inner tmux / apps quickly
set -sg escape-time 10

# Enable vim-style keys in copy mode
set-window-option -g mode-keys vi

# Enable extended keys (CSI u) so shift+enter, ctrl+enter, etc.
# pass through to applications like OpenCode
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# OSC 52 clipboard + allow passthrough for OSC sequences (e.g. nvim OSC 52 over SSH)
set -s set-clipboard on
# allow-passthrough requires tmux >= 3.3; use if-shell to skip on older versions
if-shell 'V=$(tmux -V | cut -d" " -f2 | tr -d a-z) && [ "${V%.*}" -ge 4 -o "${V%.*}" -eq 3 -a "$(echo "$V" | cut -d. -f2)" -ge 3 ] 2>/dev/null' \
  'set -g allow-passthrough on'

# Vim-style pane navigation: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing by 1: prefix + H/J/K/L
bind H resize-pane -L 1
bind J resize-pane -D 1
bind K resize-pane -U 1
bind L resize-pane -R 1

# Pane resizing by 5: Ctrl+Alt+arrow keys
bind -n C-M-Left resize-pane -L 5
bind -n C-M-Down resize-pane -D 5
bind -n C-M-Up resize-pane -U 5
bind -n C-M-Right resize-pane -R 5

# Vim-style copy mode: v to select, V for line select, y to yank to clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Window/session chooser: prefix + w
bind w choose-tree -Zw -F '#{?pane_format,#{pane_current_command},#{?window_format,#{window_name}#{?window_active, *,},#{session_name} (#{session_windows} win)}}'

# agent-notify: Ctrl+n toggles notification panel (main machine only)
if-shell 'grep -q "^role.*main" ~/.dotfiles/agent-notify/config.toml 2>/dev/null' \
  'bind -n C-n display-popup -E -w 80 -h 20 -T " Notifications " "$HOME/.local/bin/agent-notify-panel"'
