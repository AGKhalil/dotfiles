# ctrl+space is leader
set -g prefix C-Space

# hjkl for pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ctrl+hjkl navigates panes without the leader, nvim handles its own windows
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# alt+hjkl resizes panes, nvim handles its own windows
bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 1'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 1'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 1'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 1'

# v/s split like vim's :vsplit/:split
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# new windows inherit the current pane's directory
bind c new-window -c "#{pane_current_path}"

# let apps and copy mode reach the local clipboard over ssh (OSC 52)
set -s set-clipboard on
set -g allow-passthrough on

# vim mode for scroll. v/V for select. y for yank
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
